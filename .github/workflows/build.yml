      - name: Smoke test OCR engine
        shell: pwsh
        run: |
          $script = @'
          import sys
          import numpy as np
          import cv2

          # Создаём тестовое изображение с текстом
          img = np.full((120, 640, 3), 255, dtype=np.uint8)
          cv2.putText(img, "TEST 12345", (20, 80), cv2.FONT_HERSHEY_SIMPLEX, 2.0, (0, 0, 0), 4)

          from ocr_engines import OCREngineManager
          m = OCREngineManager(languages=['ru', 'en'])
          engines = m.get_available_engines()
          print(f"[INFO] available engines: {engines}")
          
          if not engines:
              print("[ERROR] No OCR engine available")
              sys.exit(1)

          # Пробуем вызвать recognize с учётом разных сигнатур
          try:
              # Версия 1: с аргументом with_details
              res = m.recognize(img, with_details=False)
          except TypeError:
              try:
                  # Версия 2: без аргумента with_details
                  res = m.recognize(img)
              except TypeError:
                  # Версия 3: вызываем напрямую через current_engine
                  res = m.current_engine.recognize(img)

          print(f"[INFO] engine: {res.engine}")
          print(f"[INFO] text: {repr(res.text)}")
          print(f"[INFO] confidence: {res.confidence}")
          print("[SUCCESS] OCR smoke test passed")
          '@
          Set-Content -Path "smoke_test.py" -Value $script -Encoding UTF8
          python smoke_test.py
