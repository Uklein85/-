name: Build DocumentOCR (Windows)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  PYTHONUNBUFFERED: "1"
  APP_NAME: DocumentOCR

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
          cache: 'pip'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install `
            "numpy>=1.24,<2.3" `
            "opencv-python-headless>=4.8" `
            "Pillow>=10.0" `
            "PyQt6>=6.5" `
            "rapidocr-onnxruntime>=1.3.2" `
            "onnxruntime>=1.16" `
            "PyMuPDF>=1.23" `
            "openpyxl>=3.1" `
            "pandas>=2.0" `
            "PyYAML>=6.0" `
            "pyinstaller>=6.6"
          python -m pip list

      - name: Extract OCR models from pip package
        shell: pwsh
        run: |
          $script = @'
          import shutil, sys
          from pathlib import Path
          import rapidocr_onnxruntime as r

          pkg = Path(r.__file__).parent
          onnx = sorted(pkg.rglob("*.onnx"))
          if not onnx:
              print("[ERROR] No .onnx models inside package.")
              sys.exit(1)

          dst = Path("ocr_models") / "rapidocr"
          dst.mkdir(parents=True, exist_ok=True)

          wanted = {
              "det": "ch_PP-OCRv4_det_infer.onnx",
              "rec": "ch_PP-OCRv4_rec_infer.onnx",
              "cls": "ch_ppocr_mobile_v2.0_cls_infer.onnx",
          }

          picked = {}
          for kind in wanted:
              for p in onnx:
                  if kind in p.name.lower() and "server" not in p.name.lower():
                      picked[kind] = p
                      break

          missing = [k for k in ("det", "rec") if k not in picked]
          if missing:
              print("[ERROR] Missing required models:", missing)
              sys.exit(1)

          for kind, src in picked.items():
              target = dst / wanted[kind]
              shutil.copy2(src, target)
              print(f"[OK] {kind}: {src.name} -> {target}")

          total = sum(f.stat().st_size for f in dst.rglob("*") if f.is_file())
          print(f"[SUCCESS] models ready: {dst} ({total/1048576:.1f} MB)")
          '@
          Set-Content -Path "extract_models.py" -Value $script -Encoding UTF8
          python extract_models.py

      - name: Verify models on disk
        run: |
          $det = "ocr_models\rapidocr\ch_PP-OCRv4_det_infer.onnx"
          $rec = "ocr_models\rapidocr\ch_PP-OCRv4_rec_infer.onnx"
          foreach ($f in @($det, $rec)) {
            if (-not (Test-Path $f)) { throw "Missing model: $f" }
            if ((Get-Item $f).Length -lt 500kb) { throw "Model too small: $f" }
          }
          Get-ChildItem ocr_models -Recurse -File |
            Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,2)}} |
            Format-Table -AutoSize

      - name: Smoke test OCR engine
        shell: pwsh
        run: |
          $script = @'
          import sys, numpy as np, cv2
          img = np.full((120, 640, 3), 255, dtype=np.uint8)
          cv2.putText(img, "TEST 12345", (20, 80), cv2.FONT_HERSHEY_SIMPLEX, 2.0, (0, 0, 0), 4)

          from ocr_engines import OCREngineManager
          m = OCREngineManager(languages=['ru', 'en'])
          engines = m.get_available_engines()
          print("[INFO] available engines:", engines)
          if not engines:
              print("[ERROR] No OCR engine available")
              sys.exit(1)

          res = m.recognize(img, with_details=False)
          print("[INFO] engine:", res.engine)
          print("[INFO] text:", repr(res.text))
          print("[SUCCESS] OCR smoke test passed")
          '@
          Set-Content -Path "smoke_test.py" -Value $script -Encoding UTF8
          python smoke_test.py

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name "$env:APP_NAME" `
            --add-data "ocr_models;ocr_models" `
            --collect-all rapidocr_onnxruntime `
            --collect-submodules onnxruntime `
            --collect-data onnxruntime `
            --hidden-import "onnxruntime.capi._pybind_state" `
            --hidden-import "pymupdf" `
            --hidden-import "fitz" `
            --hidden-import "openpyxl" `
            --hidden-import "pandas" `
            --hidden-import "yaml" `
            --hidden-import "PIL._imaging" `
            --exclude-module torch `
            --exclude-module torchvision `
            --exclude-module easyocr `
            --exclude-module paddle `
            --exclude-module paddleocr `
            --exclude-module tkinter `
            --exclude-module matplotlib `
            --exclude-module PyQt6.QtWebEngineCore `
            --exclude-module PyQt6.QtQuick `
            --exclude-module PyQt6.QtQml `
            main.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed" }

      - name: Stage release folder
        run: |
          $out = "release"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item "dist\$env:APP_NAME.exe" $out
          Copy-Item "ocr_models" $out -Recurse -Force
          if (Test-Path "README.md") { Copy-Item "README.md" $out }
          $exe = Get-Item "$out\$env:APP_NAME.exe"
          "EXE size: {0:N1} MB" -f ($exe.Length/1MB) | Write-Host

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocumentOCR-Windows-x64
          path: release/*
          retention-days: 90
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/DocumentOCR.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
