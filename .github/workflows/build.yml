name: Build DocumentOCR

on:
  push:
    tags:
      - 'v*'  # Запуск при создании тега v1.0.0 и т.д.
  workflow_dispatch:  # Ручной запуск из интерфейса GitHub

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout код
      uses: actions/checkout@v4

    - name: Установка Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Кэширование OCR моделей
      id: cache-models
      uses: actions/cache@v4
      with:
        path: ocr_models
        key: ocr-models-v1-${{ hashFiles('download_models.py') }}
        restore-keys: |
          ocr-models-v1-

    - name: Установка зависимостей
      run: |
        python -m pip install --upgrade pip
        pip install -r "requirements (2).txt"
        pip install pyinstaller

     - name: Скачивание OCR моделей
      if: steps.cache-models.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        # Переключаем консоль в UTF-8 (Windows)
        chcp 65001 | Out-Null
        $env:PYTHONUTF8 = "1"
        $env:PYTHONIOENCODING = "utf-8"
        
        Write-Host "Downloading OCR models..."
        python download_models.py
      env:
        PYTHONUTF8: 1
        PYTHONIOENCODING: utf-8

    - name: Проверка наличия моделей
      run: |
        if (-not (Test-Path "ocr_models\rapidocr\ch_PP-OCRv4_det_infer.onnx")) {
          throw "Модели не скачались!"
        }
        Get-ChildItem -Path "ocr_models" -Recurse | Select-Object FullName, Length

    - name: Сборка .exe через PyInstaller
      run: |
        pyinstaller --noconfirm --onefile --windowed `
          --name "DocumentOCR" `
          --add-data "ocr_models;ocr_models" `
          --hidden-import "rapidocr_onnxruntime" `
          --hidden-import "onnxruntime" `
          --hidden-import "cv2" `
          --hidden-import "numpy" `
          --hidden-import "PIL" `
          --hidden-import "pymupdf" `
          --hidden-import "fitz" `
          --hidden-import "yaml" `
          --hidden-import "openpyxl" `
          --hidden-import "pandas" `
          --collect-all PyQt6 `
          main.py

    - name: Загрузка артефакта
      uses: actions/upload-artifact@v4
      with:
        name: DocumentOCR-Windows
        path: dist/DocumentOCR.exe
        retention-days: 90

    - name: Создание релиза
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: dist/DocumentOCR.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
