name: Build DocumentOCR

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~\AppData\Local\pip\Cache
        key: pip-${{ runner.os }}-${{ hashFiles('requirements (2).txt') }}
        restore-keys: |
          pip-${{ runner.os }}-

    - name: Cache OCR models
      id: cache-models
      uses: actions/cache@v4
      with:
        path: ocr_models
        key: ocr-models-v1-${{ hashFiles('download_models.py') }}
        restore-keys: |
          ocr-models-v1-

    - name: Install dependencies
      shell: pwsh
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r "requirements (2).txt"
        pip install pyinstaller

    - name: Download OCR models
      if: steps.cache-models.outputs.cache-hit != 'true'
      shell: pwsh
      env:
        PYTHONUTF8: 1
        PYTHONIOENCODING: utf-8
      run: |
        Write-Host "Downloading OCR models..."
        python download_models.py
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Model download failed"
          exit 1
        }

    - name: Verify OCR models
      shell: pwsh
      run: |
        $models = @(
          "ocr_models\rapidocr\ch_PP-OCRv4_det_infer.onnx",
          "ocr_models\rapidocr\ch_PP-OCRv4_rec_infer.onnx",
          "ocr_models\rapidocr\ch_ppocr_mobile_v2.0_cls_infer.onnx"
        )
        foreach ($model in $models) {
          if (-not (Test-Path $model)) {
            Write-Error "Model not found: $model"
            exit 1
          }
          $size = (Get-Item $model).Length / 1MB
          Write-Host "OK: $model ($('{0:N1}' -f $size) MB)"
        }

    - name: Build executable with PyInstaller
      shell: pwsh
      run: |
        pyinstaller --noconfirm --onefile --windowed `
          --name "DocumentOCR" `
          --add-data "ocr_models;ocr_models" `
          --hidden-import "rapidocr_onnxruntime" `
          --hidden-import "onnxruntime" `
          --hidden-import "cv2" `
          --hidden-import "numpy" `
          --hidden-import "PIL" `
          --hidden-import "pymupdf" `
          --hidden-import "fitz" `
          --hidden-import "yaml" `
          --hidden-import "openpyxl" `
          --hidden-import "pandas" `
          --collect-all PyQt6 `
          main.py

    - name: Verify build
      shell: pwsh
      run: |
        if (-not (Test-Path "dist\DocumentOCR.exe")) {
          Write-Error "Build failed: DocumentOCR.exe not found"
          exit 1
        }
        $size = (Get-Item "dist\DocumentOCR.exe").Length / 1MB
        Write-Host "Build successful: DocumentOCR.exe ($('{0:N1}' -f $size) MB)"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: DocumentOCR-Windows
        path: dist/DocumentOCR.exe
        retention-days: 90

    - name: Create release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: dist/DocumentOCR.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
